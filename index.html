<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">

<script>window.KAHHH_STANDALONE=true;</script>
<title>Kikirara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: phone-first single column, app header + content + floating bottom dock; sheets slide up from the bottom. */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --surface-2:#f6f8f4; --ink:#141a13; --muted:#6a7465; --line:#e3e8df;
  --forest:#24401f; --forest-ink:#ffffff; --lime:#d5ef6a; --lime-ink:#1d3018;
  --amber:#b45f06; --amber-bg:#fdf3dc; --red:#b42318; --red-bg:#fde8e6; --green:#2f6b1f; --green-bg:#e6f3dc;
  --blue:#2a4fb5; --blue-bg:#eaf0fd; --purple:#6b3fd4; --purple-bg:#f0eafd; --slate:#4a5566; --slate-bg:#eef1f5;
  --cyan:#0e7490; --cyan-bg:#e2f5f9; --shadow:0 1px 2px rgba(20,30,15,.05),0 6px 20px rgba(20,30,15,.06);
  --f-ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e120d; --surface:#171c16; --surface-2:#1d231b; --ink:#eef3ea; --muted:#9aa694; --line:#2a3227;
  --forest:#d5ef6a; --forest-ink:#17260f; --lime:#d5ef6a; --lime-ink:#17260f;
  --amber:#f2b453; --amber-bg:#3a2b12; --red:#ff8a7f; --red-bg:#3d1a17; --green:#a8dc7f; --green-bg:#1f3318;
  --blue:#9ab5ff; --blue-bg:#1a2442; --purple:#c2a8ff; --purple-bg:#2a1f44; --slate:#b5c0cf; --slate-bg:#232a33;
  --cyan:#7fd6ea; --cyan-bg:#13303a; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e120d; --surface:#171c16; --surface-2:#1d231b; --ink:#eef3ea; --muted:#9aa694; --line:#2a3227;
  --forest:#d5ef6a; --forest-ink:#17260f; --lime:#d5ef6a; --lime-ink:#17260f;
  --amber:#f2b453; --amber-bg:#3a2b12; --red:#ff8a7f; --red-bg:#3d1a17; --green:#a8dc7f; --green-bg:#1f3318;
  --blue:#9ab5ff; --blue-bg:#1a2442; --purple:#c2a8ff; --purple-bg:#2a1f44; --slate:#b5c0cf; --slate-bg:#232a33;
  --cyan:#7fd6ea; --cyan-bg:#13303a; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.plate-pill{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 12px 9px 16px;font-family:var(--f-mono);font-weight:700;letter-spacing:.06em;font-size:14px;flex:none}
.hdr-title{flex:1;min-width:0}
.brand{width:44px;height:44px;flex:none;display:block}.brand svg{width:100%;height:100%;display:block;border-radius:12px;box-shadow:0 0 0 1px var(--line)}
.brandname{font-size:22px!important;letter-spacing:-.03em!important}
.hdr-title b{display:block;font-size:16px;font-weight:800;letter-spacing:-.01em}
.hdr-title small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;font-weight:700;padding:11px 18px;background:var(--forest);color:var(--forest-ink);white-space:nowrap}
.btn.sm{padding:9px 14px;font-size:14px}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.block{width:100%;border-radius:16px;padding:16px;font-size:16px}
.btn.danger{background:var(--red-bg);color:var(--red)}
.btn:disabled{opacity:.5;cursor:default}
.iconbtn{width:42px;height:42px;border-radius:999px;display:grid;place-items:center;background:var(--lime);color:var(--lime-ink);flex:none}
.iconbtn.plain{background:var(--surface-2);color:var(--ink)}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* content */
.stack{display:flex;flex-direction:column;gap:14px;padding-top:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.tap{cursor:pointer;text-align:left;width:100%;transition:transform .12s}
.tap:active{transform:scale(.99)}
.row{display:flex;align-items:center;gap:14px}
.ico-tile{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--surface-2);flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{padding:16px;display:flex;align-items:center;gap:12px;min-width:0}
.stat .lbl{color:var(--muted);font-size:13px}
.stat .val{font-weight:800;font-size:18px;letter-spacing:-.01em}
.stat>div:last-child{min-width:0}
@media (max-width:380px){.stat .ico-tile{display:none}}
.label{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.sec-h h2{font-size:19px;margin:0;font-weight:800;letter-spacing:-.01em}
.link{color:var(--ink);font-weight:700;display:inline-flex;align-items:center;gap:4px}
/* hero */
.hero{position:relative;border-radius:26px;overflow:hidden;min-height:220px;color:#fff;padding:22px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;background:#203; isolation:isolate}
.hero .bgimg{position:absolute;inset:0;background-size:cover;background-position:center;z-index:-2}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 20%,rgba(0,0,0,.65));z-index:-1}
.hero .nick{font-weight:800;font-size:17px;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.plate{display:inline-flex;align-items:center;gap:14px;background:#24401f;color:#fff;border-radius:12px;padding:8px 16px;font-family:var(--f-mono);font-weight:700;font-size:26px;letter-spacing:.08em;align-self:flex-start}
.plate::before,.plate::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
.hero .meta{font-weight:600;font-size:15px;text-shadow:0 1px 6px rgba(0,0,0,.5);display:flex;align-items:center;gap:8px}
.hero .silh{position:absolute;right:-10px;top:10px;width:62%;opacity:.22;z-index:-1}
.hero .silh svg{width:100%;height:auto;stroke:#fff;fill:none;stroke-width:1.2}
/* banners */
.banner{padding:18px;display:flex;gap:14px;align-items:flex-start;border-radius:22px;border:1.5px solid}
.banner b{display:block;font-size:16px}
.banner span{display:block;font-size:14px;margin-top:2px}
.banner.blue{background:var(--blue-bg);border-color:color-mix(in srgb,var(--blue) 30%,transparent);color:var(--blue)}
.banner.amber{background:var(--amber-bg);border-color:color-mix(in srgb,var(--amber) 35%,transparent);color:var(--amber)}
.banner .ico-tile{background:color-mix(in srgb,currentColor 12%,transparent)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-size:13px;font-weight:700;white-space:nowrap}
.pill.amber{background:var(--amber-bg);color:var(--amber);border:1px solid color-mix(in srgb,var(--amber) 30%,transparent)}
.pill.red{background:var(--red-bg);color:var(--red)}
.pill.green{background:var(--green-bg);color:var(--green)}
.pill.gray{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
/* chips by category */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:5px 12px;font-size:14px;font-weight:700;background:var(--c-bg);color:var(--c)}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.chip.more{background:var(--surface-2);color:var(--muted)}.chip.more::before{display:none}
[data-cat=Oil]{--c:var(--amber);--c-bg:var(--amber-bg)}
[data-cat=Filter]{--c:var(--green);--c-bg:var(--green-bg)}
[data-cat=Brake]{--c:var(--red);--c-bg:var(--red-bg)}
[data-cat=Tyre]{--c:var(--slate);--c-bg:var(--slate-bg)}
[data-cat=Belt]{--c:var(--purple);--c-bg:var(--purple-bg)}
[data-cat=Battery]{--c:var(--blue);--c-bg:var(--blue-bg)}
[data-cat=Aircond]{--c:var(--cyan);--c-bg:var(--cyan-bg)}
[data-cat=Other]{--c:var(--muted);--c-bg:var(--slate-bg)}
/* visit card */
.visit{overflow:hidden}
.visit .top{padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.visit .date{font-size:20px;font-weight:800;letter-spacing:-.01em;display:flex;justify-content:space-between;gap:10px;align-items:center}
.visit .sub{color:var(--muted);display:flex;align-items:center;gap:8px;font-size:14.5px}
.visit .foot{background:var(--surface-2);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-weight:600}
.visit .foot .amt{color:var(--ink);font-family:var(--f-mono);font-size:24px;font-weight:700}
.visit .foot .amt small{font-size:13px;color:var(--muted);margin-right:4px;font-family:var(--f-ui)}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 16px;color:var(--muted)}
.search input{border:0;outline:0;background:none;flex:1;min-width:0;font-size:16px}
/* garage */
.vcard{position:relative;border-radius:24px;overflow:hidden;color:#fff;min-height:150px;padding:18px 20px 18px 96px;display:flex;flex-direction:column;justify-content:center;gap:2px;isolation:isolate;text-align:left;width:100%}
.vcard .bgimg{position:absolute;inset:0;background-size:cover;background-position:center;z-index:-2}
.vcard::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.6),rgba(0,0,0,.25));z-index:-1}
.vcard .badge{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:62px;height:62px;border-radius:16px;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);display:grid;place-items:center}
.vcard .badge svg{width:28px;height:28px}
.vcard .pl{font-family:var(--f-mono);font-weight:700;font-size:21px;letter-spacing:.06em}
.vcard .nn{font-weight:800}
.vcard .mm{opacity:.95;font-weight:600}
.vcard .kk{font-family:var(--f-mono);font-size:13.5px;opacity:.95;display:flex;gap:14px;margin-top:4px}
.vcard .chev{position:absolute;right:16px;top:50%;transform:translateY(-50%)}
.empty{padding:28px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
/* summary */
.yr{display:flex;justify-content:space-between;align-items:center}
select.sel{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:700}
.big{font-size:30px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hot{background:#7a1c1c;color:#fff;border-color:transparent}
.hot .label{color:#f6b8b0}
.hot .big{font-size:24px;color:#ffc2b8}
.fchips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.fchip{border:1.5px solid var(--c);color:var(--c);border-radius:999px;padding:7px 14px;font-weight:700;white-space:nowrap;background:var(--c-bg)}
.fchip[aria-pressed=false]{background:transparent;opacity:.5}
.part{padding:20px}
.part .ph{display:flex;align-items:center;gap:12px;justify-content:space-between}
.part .ph h3{margin:0;font-size:19px;font-weight:800;flex:1;min-width:0}
.part .cols{display:grid;grid-template-columns:1fr 1fr;margin-top:16px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.part .cols>div+div{border-left:1px solid var(--line);padding-left:16px}
.part .cols .v{font-size:19px;font-weight:800;margin-top:4px}
.part .cols .s{color:var(--muted);font-size:14px}
.tl{position:relative;margin-top:16px;padding-top:6px;overflow-x:auto}
.tl .track{position:relative;height:30px;min-width:100%}
.tl .track::before{content:"";position:absolute;left:6px;right:6px;top:6px;height:2px;background:var(--line)}
.tl .dot{position:absolute;top:0;width:14px;height:14px;border-radius:50%;background:var(--c);transform:translateX(-50%)}
.tl .dot span{position:absolute;top:20px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--muted);white-space:nowrap}
/* fuel */
.prices .pr{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line);font-weight:700}
.prices .pr:first-of-type{border-top:0}
.prices .pr .g{flex:1;color:var(--muted);letter-spacing:.06em;display:flex;align-items:center;gap:10px}
.prices .pr .g::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--gc)}
.savings{background:color-mix(in srgb,var(--green-bg) 70%,var(--surface));border:1.5px solid color-mix(in srgb,var(--green) 25%,transparent);padding:18px 20px;display:flex;justify-content:space-between;align-items:center;border-radius:22px;font-weight:800;font-size:17px;color:var(--green)}
.savings .num{color:var(--ink);font-size:20px}
.fill{padding:18px 20px;display:flex;gap:10px;align-items:flex-start}
.fill .fx{flex:1;min-width:0}
.fill .fd{font-weight:800;font-size:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fill .fm{color:var(--muted);font-size:14.5px;margin-top:4px;display:flex;gap:14px;flex-wrap:wrap}
/* dock */
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:6px;box-shadow:0 10px 30px rgba(10,20,5,.18)}
.dock button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:16px;font-size:10.5px;font-weight:700;color:var(--muted);min-width:50px}
.dock{gap:2px!important;padding:5px!important}
.dock button[aria-current=page]{background:var(--lime);color:var(--lime-ink)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,9,.45);z-index:40;opacity:0;transition:opacity .2s;pointer-events:none}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92%;display:flex;flex-direction:column;background:var(--surface);border-radius:26px 26px 0 0;transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-width:560px;margin:0 auto}
.sheet.on{transform:none}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:10px auto 0;flex:none}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;padding:12px max(20px,env(safe-area-inset-right,0px)) 12px max(20px,env(safe-area-inset-left,0px));flex:none}
.sheet .sh h3{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.sheet .sb>*{flex-shrink:0}
.sheet .sb{overflow-y:auto;padding:4px max(20px,env(safe-area-inset-right,0px)) 16px max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet .sf{padding:12px max(20px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;flex:none}
.fld{display:flex;flex-direction:column;gap:6px}
.fld>span{font-weight:700;font-size:14.5px}
.fld>span em{font-style:normal;color:var(--muted);font-weight:500}
.in{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 14px;font-size:16px;width:100%;min-width:0}
.in:focus{outline:2px solid color-mix(in srgb,var(--forest) 50%,transparent);border-color:transparent}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:14px;padding:4px}
.seg button{padding:10px;border-radius:11px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.presets{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.presets button{border:1px solid var(--line);border-radius:12px;padding:12px 0;font-weight:700;color:var(--muted)}
.presets button[aria-pressed=true]{border:2px solid var(--forest);color:var(--ink);background:var(--surface-2)}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grades button{border:1px solid var(--line);border-radius:14px;padding:14px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;color:var(--muted)}
.grades button small{font-weight:600;font-size:13px}
.grades button[aria-pressed=true]{background:#ecc85e;border:2px solid #b8962f;color:#1d1a0a}
input[type=range]{width:100%;accent-color:var(--forest)}
.toggle{width:52px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.toggle[aria-checked=true]{background:var(--forest)}
.toggle[aria-checked=true]::after{left:25px}
.box{border:1px solid var(--line);border-radius:16px;padding:14px}
.items{border:1px solid var(--line);border-radius:18px;overflow:hidden}
.items .it{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line)}
.items .it:first-child{border-top:0}
.items .it .nm{flex:1;min-width:0;font-weight:600;font-size:16px}
.items .it .pr{font-family:var(--f-mono);color:var(--muted)}
.items .tot{background:var(--surface-2);display:flex;justify-content:space-between;padding:14px 16px;border-top:1px solid var(--line)}
.items .tot .num{font-weight:700;font-size:18px}
.erow{display:grid;grid-template-columns:110px 1fr 92px 34px;gap:6px;align-items:center}
.erow .in{padding:10px;font-size:15px}
@media (max-width:420px){.erow{grid-template-columns:1fr 92px 34px}.erow select{grid-column:1/-1}}
.mbadge{width:36px;height:36px;border-radius:50%;display:inline-grid;place-items:center;background:var(--surface-2);border:1.5px solid var(--line);font-family:var(--f-mono);font-size:11px;font-weight:700;color:var(--ink);flex:none;letter-spacing:.02em}
.mbadge.img{width:26px;height:26px;font-size:9.5px;background:rgba(255,255,255,.92);color:#141a13;border:0}
.copyrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px;border:1px solid var(--line);border-radius:14px}
.copyrow .v{font-family:var(--f-mono);font-weight:700;font-size:17px;user-select:all;word-break:break-all}
.wheels{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wheel{border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}

}

function lastVisit(v){return [...v.visits].sort((a,b)=>b.date.localeCompare(a.date))[0]}
function nextService(v){
  const lv=lastVisit(v);if(!lv)return null;
  const date=addMonths(lv.date,v.intervalMonths||6);
  const atKm=(lv.odo||0)+(v.intervalKm||10000);
  const days=Math.round((pd(date)-pd(today()))/864e5);
  const kmLeft=atKm-(v.mileage||0);
  const tone=(days<0||kmLeft<0)?'red':(days<=30||kmLeft<=1000)?'amber':'green';
  const label=(days<0||kmLeft<0)?'Overdue':'Due';
  return {date,atKm,days,kmLeft,tone,label};
}
const daysTo=s=>Math.round((pd(s)-pd(today()))/864e5);
const ymKey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
function dueOn(ym,day){const[y,m]=ym.split('-').map(Number);const last=new Date(y,m,0).getDate();return iso(new Date(y,m-1,Math.min(day||1,last)))}
function loanInfo(v){
  const L=v.loan;if(!L||!(+L.monthly))return null;
  const paid=L.paid||[];const total=+L.total||0;
  const startKey=(L.start||today()).slice(0,7);
  const n=L.tenure||600;let next=null;
  for(let i=0;i<n;i++){const k=monthsFrom(startKey,i+1)[i];if(!paid.includes(k)){next={key:k,date:dueOn(k,L.dueDay||+L.start.slice(8,10))};break}}
  const paidAmt=paid.length*L.monthly;const remaining=Math.max(0,total-paidAmt);
  const monthsLeft=L.tenure?Math.max(0,L.tenure-paid.length):Math.ceil(remaining/L.monthly);
  const endKey=monthsFrom(startKey,n)[n-1];
  return {paid:paid.length,paidAmt,remaining,next,monthsLeft,endKey,pct:total?Math.min(100,paidAmt/total*100):0};
}
function dueState(date,warn){if(!date)return null;const d=daysTo(date);return {days:d,tone:d<0?'red':d<=warn?'amber':'green',
  text:d<0?`Overdue ${-d} day${d==-1?'':'s'}`:d===0?'Due today':d===1?'Due tomorrow':d<=60?`${d} days left`:`${Math.round(d/30.4)} months left`}}
function obligations(v){
  const out=[];const li=loanInfo(v);
  if(v.loan&&v.loan.monthly)out.push({k:'loan',icon:'bank',title:'Loan payment',sub:li.next?`${rm(v.loan.monthly)} to ${esc(v.loan.lender||'lender')}`:'Fully paid',date:li.next&&li.next.date,warn:v.loan.remindDays??3,done:!li.next});
  else out.push({k:'loan',icon:'bank',title:'Loan',sub:'Add total loan and monthly payment',date:null});
  const ins=v.insurance||{};out.push({k:'ins',icon:'shield',title:'Insurance',sub:ins.expiry?`${esc(ins.insurer||'Policy')} expires ${fmtD(ins.expiry)}`:'Add expiry date and premium',date:ins.expiry,warn:30});
  const rt=v.roadTax||{};out.push({k:'tax',icon:'stamp',title:'Road tax',sub:rt.expiry?`Expires ${fmtD(rt.expiry)}`:'Add expiry date',date:rt.expiry,warn:30});
  const lc=S.settings.license||{};out.push({k:'lic',icon:'idcard',title:'Driving licence',sub:lc.expiry?`Class ${esc(lc.classes||'—')} · expires ${fmtD(lc.expiry)}`:'Add expiry date',date:lc.expiry,warn:30});
  out.forEach(o=>o.st=dueState(o.date,o.warn));return out;
}
function urgent(v){return obligations(v).filter(o=>o.st&&o.st.days<=o.warn).sort((a,b)=>a.st.days-b.st.days)}
function obRow(o){
  return `<button class="ob tap" data-act="ob" data-k="${o.k}"><span class="ico-tile">${I(o.icon)}</span><span class="obt"><b>${o.title}</b><span>${o.sub}</span></span>${o.st?`<span class="pill ${o.st.tone}">${o.st.text}</span>`:o.done?'<span class="pill green">Done</span>':`<span class="pill gray">Set up</span>`}</button>`;
}
function fuelStats(v){
  const f=v.fuel;const spent=f.reduce((a,b)=>a+b.total,0),litres=f.reduce((a,b)=>a+b.litres,0);
  const saved=f.reduce((a,b)=>a+(b.budi?b.litres*((b.full||0)-b.price):0),0);
  const s=[...f].filter(x=>x.odo).sort((a,b)=>a.odo-b.odo);let dist=0,lit=0;
  for(let i=1;i<s.length;i++){dist+=s[i].odo-s[i-1].odo;lit+=s[i].litres}
  return {spent,litres,saved,avg:litres?spent/litres:0,eff:lit?dist/lit:0,count:f.length};
}

function dueList(it,toISO){const out=[];const n=maxCount(it);for(let k=0;k<n;k++){const d=it.freq?addM(it.next,k*it.freq):it.next;if(d>toISO)break;out.push(d);if(!it.freq)break}return out}
function nextDue(it){const n=Math.min(maxCount(it),1200);const p=it.paid||{};for(let k=0;k<n;k++){const d=it.freq?addM(it.next,k*it.freq):it.next;if(!p[d])return d;if(!it.freq)break}return null}
function expected(it){return kT(it.kind)==='card'?(+((it.card||{}).balance)||0):(+it.amount||0)}
function monthlyEq(it){if(kT(it.kind)==='card'||!it.freq||!nextDue(it))return 0;return (+it.amount||0)/it.freq}
function loanLeft(it){const L=it.loan||{};const paidSum=Object.values(it.paid||{}).reduce((a,b)=>a+(+b.amount||0),0);return Math.max(0,(+L.total||0)-(L.madeBefore||0)*(+it.amount||0)-paidSum)}
const minPay=it=>{const c=it.card||{};const b=+c.balance||0;return Math.min(b,Math.max(50,b*(c.minPct??5)/100))};
function itemOcc(it,ym){
  const end=iso(new Date(+ym.slice(0,4),+ym.slice(5,7),0));const p=it.paid||{};
  return dueList(it,end).filter(d=>d.startsWith(ym)).map(d=>({src:'item',it,date:d,paid:!!p[d],amount:p[d]?+p[d].amount:expected(it)}));
}
function vehicleOcc(ym){
  const out=[];
  S.vehicles.forEach(v=>{
    const L=v.loan;
    if(L&&+L.monthly&&L.start){const sk=L.start.slice(0,7);const i=(+ym.slice(0,4)-+sk.slice(0,4))*12+(+ym.slice(5,7)-+sk.slice(5,7));
      if(i>=0&&i<(L.tenure||600))out.push({src:'vloan',v,key:ym,date:dueOn(ym,L.dueDay||+L.start.slice(8,10)),paid:(L.paid||[]).includes(ym),amount:+L.monthly})}
    const ins=v.insurance||{};if(ins.expiry&&ins.expiry.startsWith(ym))out.push({src:'vins',v,date:ins.expiry,paid:false,amount:+ins.premium||0});
    const rt=v.roadTax||{};if(rt.expiry&&rt.expiry.startsWith(ym))out.push({src:'vtax',v,date:rt.expiry,paid:false,amount:+rt.amount||0});
  });
  return out;
}
function monthBills(ym){return [...S.items.flatMap(it=>itemOcc(it,ym)),...vehicleOcc(ym)].sort((a,b)=>a.date.localeCompare(b.date))}
function vName(v){return esc(v.nickname||v.plate)}
function occTitle(o){if(o.src==='item')return esc(o.it.name);return o.src==='vloan'?`${vName(o.v)} loan`:o.src==='vins'?`${vName(o.v)} insurance`:`${vName(o.v)} road tax`}
function occSub(o){if(o.src==='item')return esc(o.it.provider||kL(o.it.kind));return o.src==='vloan'?esc(o.v.loan.lender||'Vehicle loan'):'Renewal'}
function occIcon(o){if(o.src==='item')return kIcon(o.it.kind);return o.src==='vloan'?'bank':o.src==='vins'?'shield':'stamp'}
function spendFor(ym){
  const own=(S.spend[ym]||[]).map(e=>({...e,own:true}));const veh=[];
  S.vehicles.forEach(v=>{
    (v.fuel||[]).filter(f=>f.date.startsWith(ym)).forEach(f=>veh.push({id:f.id,date:f.date.slice(0,10),amount:+f.total,cat:'Fuel',note:`${v.nickname||v.plate}${f.station?' · '+f.station:''}`,vid:v.id,to:'fuel'}));
    (v.visits||[]).filter(x=>x.date.startsWith(ym)).forEach(x=>veh.push({id:x.id,date:x.date,amount:visitTotal(x),cat:'Car service',note:`${v.nickname||v.plate}${x.workshop?' · '+x.workshop:''}`,vid:v.id,to:'records'}));
  });
  return [...own,...veh].sort((a,b)=>b.date.localeCompare(a.date));
}
function attention(){
  const out=[];
  S.items.forEach(it=>{const d=nextDue(it);if(!d)return;const w=it.remindDays??3;const st=dueState(d,w);if(st.days<=w)out.push({kind:'item',id:it.id,title:esc(it.name),date:d,st,amount:expected(it)})});
  S.vehicles.forEach(v=>urgent(v).forEach(o=>{if(o.k==='lic')return;out.push({kind:'veh',vid:v.id,title:`${vName(v)} ${o.k==='loan'?'loan':o.k==='ins'?'insurance':'road tax'}`,date:o.date,st:o.st,amount:o.k==='loan'?+v.loan.monthly:o.k==='ins'?+(v.insurance||{}).premium:+(v.roadTax||{}).amount})}));
  const lc=S.settings.license||{};if(lc.expiry){const st=dueState(lc.expiry,30);if(st.days<=30)out.push({kind:'lic',title:'Driving licence',date:lc.expiry,st})}
  return out.sort((a,b)=>a.st.days-b.st.days);
}
function debtTotal(){let t=0;S.items.forEach(it=>{const k=kT(it.kind);if(k==='loan')t+=loanLeft(it);if(k==='card')t+=+((it.card||{}).balance)||0});S.vehicles.forEach(v=>{const li=loanInfo(v);if(li)t+=li.remaining});return t}
function monthlyCommit(){return S.items.reduce((a,it)=>a+monthlyEq(it),0)+S.vehicles.reduce((a,v)=>{const li=loanInfo(v);return a+(li&&li.next?+v.loan.monthly:0)+((+(v.insurance||{}).premium||0)+(+(v.roadTax||{}).amount||0))/12},0)}
const policies=()=>S.items.filter(it=>kG(it.kind)==='ins');
const yearlyPrem=it=>it.freq?(+it.amount||0)*12/it.freq:(+it.amount||0);

/* ---------- home charts ---------- */
const kfmt=v=>v>=1000?(v/1000).toFixed(v>=10000?0:1)+'k':String(Math.round(v));
function dailyChart(ym){
  const [y,m]=ym.split('-').map(Number);const dim=new Date(y,m,0).getDate();const sd={};spendFor(ym).forEach(e=>sd[e.date]=(sd[e.date]||0)+e.amount);
  const t=today();const vals=[...Array(dim)].map((_,i)=>{const ds=`${ym}-${String(i+1).padStart(2,'0')}`;return {ds,d:i+1,v:sd[ds]||0}});
  const past=vals.filter(x=>x.ds<=t);const max=Math.max(1,...vals.map(x=>x.v));const avg=past.length?past.reduce((a,x)=>a+x.v,0)/past.length:0;
  if(isLine())return cumLine(ym);

/* ---------- line charts ---------- */
const isLine=()=>S.settings.chart!=='bar';
function chartToggle(){return `<span class="mseg" role="group" aria-label="Chart style"><button data-act="chartType" data-t="bar" aria-pressed="${!isLine()}">Bar</button><button data-act="chartType" data-t="line" aria-pressed="${isLine()}">Line</button></span>`}
function lineSvg(series,labels,o={}){
  const W=340,H=o.sub?194:180,pl=6,pr=14,pt=20,pb=o.sub?38:24;const n=labels.length;
  const max=Math.max(1,...series.flatMap(s=>s.vals.filter(v=>v!=null)));
  const x=i=>pl+(n<2?0:(W-pl-pr)*i/(n-1));const y=v=>pt+(H-pt-pb)*(1-v/max);
  const grid=[0,.5,1].map(f=>`<line x1="${pl}" x2="${W-pr}" y1="${y(max*f).toFixed(1)}" y2="${y(max*f).toFixed(1)}" class="lg"/>${f?`<text x="${pl}" y="${(y(max*f)-4).toFixed(1)}" class="lt">${kfmt(max*f)}</text>`:''}`).join('');
  const lines=series.map(s=>{const pts=s.vals.map((v,i)=>v==null?null:[x(i),y(v)]).filter(Boolean);if(!pts.length)return'';
    const d=pts.map((p,i)=>`${i?'L':'M'}${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ');const last=pts[pts.length-1];
    return `${s.area?`<path d="${d} L${last[0].toFixed(1)} ${y(0).toFixed(1)} L${pts[0][0].toFixed(1)} ${y(0).toFixed(1)} Z" class="la ${s.cls}"/>`:''}<path d="${d}" class="ll ${s.cls}${s.dash?' dash':''}"/>${s.dash?'':`<circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4" class="ld ${s.cls}"/>`}`}).join('');
  const every=o.every||1;
  const xl=labels.map((l,i)=>(i%every===0||i===n-1)&&l!==''?`<text x="${x(i).toFixed(1)}" y="${o.sub?H-19:H-6}" class="lt" text-anchor="${i===0?'start':i===n-1?'end':'middle'}">${l}${o.sub?`<tspan x="${x(i).toFixed(1)}" dy="13" class="lt2">${o.sub[i]}</tspan>`:''}</text>`:'').join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="lsvg" role="img" aria-label="${esc(o.aria||'Line chart')}">${grid}${lines}${xl}</svg>`;
}
function trendLine(endYm,n=6){
  const months=[...Array(n)].map((_,i)=>shiftYM(endYm,i-n+1));const data=months.map(m=>({m,b:sumAmt(monthBills(m)),s:sumAmt(spendFor(m))}));
  return `<div class="card chart">${lineSvg([{vals:data.map(d=>d.b),cls:'cb'},{vals:data.map(d=>d.s),cls:'cs',area:1}],months.map(m=>pd(m+'-01').toLocaleDateString('en-GB',{month:'short'})),{aria:'Bills and spending by month'})}
   <div class="cal-k"><span><span class="dotc" style="--c:var(--forest)"></span>Bills ${rm(data[n-1].b)}</span><span><span class="dotc" style="--c:var(--amber)"></span>Spending ${rm(data[n-1].s)}</span></div></div>`;
}
function cumLine(ym){
  const [y,m]=ym.split('-').map(Number);const dim=new Date(y,m,0).getDate();const t=today();
  const cum=(mm,limit)=>{const sd={};spendFor(mm).forEach(e=>sd[+e.date.slice(8,10)]=(sd[+e.date.slice(8,10)]||0)+e.amount);let run=0;const [yy,mo]=mm.split('-').map(Number);const dd=new Date(yy,mo,0).getDate();
    return [...Array(dim)].map((_,i)=>{if(i>=dd)return null;const ds=`${mm}-${String(i+1).padStart(2,'0')}`;if(limit&&ds>t)return null;run+=sd[i+1]||0;return run})};
  const nowV=cum(ym,true),prevV=cum(shiftYM(ym,-1),false);const lastNow=[...nowV].reverse().find(v=>v!=null)||0;
  return `<div class="sec-h"><h2>Month to date</h2>${chartToggle()}</div><div class="card chart">${lineSvg([{vals:prevV,cls:'cp',dash:1},{vals:nowV,cls:'cs',area:1}],[...Array(dim)].map((_,i)=>String(i+1)),{every:5,aria:'Running spending total, this month against last month'})}
   <div class="cal-k"><span><span class="dotc" style="--c:var(--amber)"></span>This month ${rm(lastNow)}</span><span><span class="avgkey"></span>Last month</span></div></div>`;
}
function weekLine(ds){
  const d0=pd(ds);const days=[...Array(7)].map((_,i)=>iso(new Date(d0.getFullYear(),d0.getMonth(),d0.getDate()-6+i)));
  const vals=days.map(d=>sumAmt(spendFor(d.slice(0,7)).filter(e=>e.date===d)));
  return `<div class="sec-h"><h2>Last 7 days</h2>${chartToggle()}</div><div class="card chart">${lineSvg([{vals,cls:'cs',area:1}],days.map(d=>pd(d).toLocaleDateString('en-GB',{weekday:'short'})),{sub:days.map(d=>String(+d.slice(8,10))),aria:'Spending over the last 7 days'})}<div class="cal-k"><span>Total ${rm(vals.reduce((a,b)=>a+b,0))}</span></div></div>`;
}
function yearLine(y){
  const months=[...Array(12)].map((_,i)=>`${y}-${String(i+1).padStart(2,'0')}`);const data=months.map(m=>({b:sumAmt(monthBills(m)),s:sumAmt(spendFor(m))}));
  return `<div class="card chart">${lineSvg([{vals:data.map(d=>d.b),cls:'cb'},{vals:data.map(d=>d.s),cls:'cs',area:1}],MSHORT,{aria:'Bills and spending by month'})}<div class="cal-k"><span><span class="dotc" style="--c:var(--forest)"></span>Bills</span><span><span class="dotc" style="--c:var(--amber)"></span>Spending</span><span>Later months show bills still to come</span></div></div>`;

function saveLoan(){
  const v=cur();const n=x=>+val(x).replace(/[^\d.]/g,'')||0;
  const total=n('l_total'),monthly=n('l_month');if(!monthly){toast('Enter the monthly payment');return}
  const start=val('l_start')||today();const count=Math.max(0,Math.round(n('l_paid')));
  const tenure=Math.round(n('l_ten'))||(total?Math.ceil(total/monthly):0);
  v.loan={lender:val('l_lender'),total:total||monthly*tenure,monthly,start,tenure,dueDay:+start.slice(8,10),remindDays:Math.round(n('l_rem')),paid:monthsFrom(start.slice(0,7),count)};
  closeSheet();touch(v);toast('Loan saved');
}

function resizeImage(file,max=900,q=.68){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{const r2=new FileReader();r2.onload=()=>res({dataUrl:r2.result,blob:b});r2.readAsDataURL(b)},'image/jpeg',q)};img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

function saveFuel(id){
  const v=cur();const st=sheetSave&&sheetSave();if(!st)return;
  if(!(st.litres>0)){toast('Enter how much you filled');return}
  const pr=S.settings.prices[st.grade.toLowerCase()];
  let f=v.fuel.find(a=>a.id===id);if(!f){f={id:uid()};v.fuel.push(f)}
  const odo=+val('f_fodo').replace(/\D/g,'')||0;
  Object.assign(f,{date:val('f_fdate')||isoT(new Date()),odo,litres:+st.litres.toFixed(2),grade:st.grade,budi:!!(st.budi&&pr.budi),price:st.budi&&pr.budi?pr.budi:pr.full,full:pr.full,total:+st.amount.toFixed(2),station:val('f_st')});
  if(odo>v.mileage)v.mileage=odo;
  closeSheet();touch(v);toast('Fill-up saved');
}

/* backup & restore */
function backupDone(){S.settings.lastBackup=today();persistSettings();render();toast('Backup saved')}
async function doBackup(){
  const name=`kikirara-backup-${today()}.json`;
  const data=JSON.stringify({app:'kikirara',version:2,exported:new Date().toISOString(),vehicles:S.vehicles,items:S.items,spend:S.spend,assets:S.assets,settings:S.settings});
  const file=new File([data],name,{type:'application/json'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Kahhh backup'});backupDone();return}}
  catch(e){if(e&&e.name==='AbortError')return}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);backupDone()}
  catch(e){toast('Could not save the backup on this browser')}
}
let pendingRestore=null;
function pickRestore(){
  fileHandler=async f=>{
    let d;try{d=JSON.parse(await f.text())}catch(e){toast('That file is not a Kikirara backup');return}
    if(!d||!['kikirara','kira','kahhh'].includes(d.app)||!Array.isArray(d.vehicles)){toast('That file is not a Kikirara backup');return}
    pendingRestore=d;
    const nv=d.vehicles.length,nvis=(d.items||[]).length;
    openSheet('Restore backup',`<p style="margin:0">Backup from <b>${fmtD(d.exported.slice(0,10))}</b> has ${nvis} bill${nvis==1?'':'s'} and ${nv} vehicle${nv==1?'':'s'}.</p>
      ${S.vehicles.length||S.items.length?`<div class="exbar" style="color:var(--red)">This replaces everything currently on this phone.</div>`:''}`,
      `<button class="btn block" data-act="restoreGo">Restore</button>`);
  };
  $('#fileIn').accept='application/json,.json';$('#fileIn').click();
}
function restoreGo(){
  const d=pendingRestore;if(!d)return;pendingRestore=null;
  S.vehicles=d.vehicles;S.items=d.items||[];S.spend=d.spend||{};S.assets=d.assets||[];S.settings={...S.settings,...(d.settings||{}),isExample:false,lastBackup:S.settings.lastBackup};
  if(!S.vehicles.find(v=>v.id===S.settings.currentId))S.settings.currentId=S.vehicles[0]&&S.vehicles[0].id;
  lsSave();S.vehicles.forEach(persistVehicle);S.items.forEach(persistItem);Object.keys(S.spend).forEach(persistSpend);S.assets.forEach(persistAsset);persistSettings();closeSheet();S.view='home';render();toast('Backup restored');
}

   case 'calMonth':S.month=b.dataset.m;S.cal.mode='month';S.cal.day=S.month===ymNow()?today():S.month+'-01';render();scrollTo(0,0);break;
   case 'calToday':S.cal.day=today();S.month=ymNow();render();break;
   case 'dprev':case 'dnext':{const d=pd(S.cal.day);d.setDate(d.getDate()+(a==='dprev'?-1:1));S.cal.day=iso(d);S.month=S.cal.day.slice(0,7);render();break}
   case 'yprev':S.calYear=String(+S.calYear-1);render();break;
   case 'ynext':S.calYear=String(+S.calYear+1);render();break;
   case 'addSpendOn':spendSheet(null,b.dataset.d);break;
   case 'addAsset':assetAddSheet();break;
   case 'addHouse':houseForm();break;
   case 'openHouse':S.houseId=id;S.view='house';render();scrollTo(0,0);break;
   case 'editHouse':houseForm(S.assets.find(x=>x.id===id));break;
   case 'saveHouse':saveHouse(id);break;
   case 'delHouse':if(b.dataset.armed){S.assets=S.assets.filter(x=>x.id!==id);S.items.forEach(it=>{if(it.asset===id){it.asset='';persistItem(it)}});commitExample();removeAssetDoc(id);closeSheet();S.view='assets';render();toast('Property removed')}else{b.dataset.armed=1;b.innerHTML=I('trash')+'Tap again to remove'}break;
   case 'addForHouse':S.pendingAsset=id;kindSheet([],{kinds:HOUSE_KINDS,title:'Add a bill for this property'});break;
   case 'saveItem':saveItem(id,b.dataset.kind);break;
   case 'item':{const it=S.items.find(x=>x.id===id);if(it)itemSheet(it);break}
   case 'editItem':itemForm(null,S.items.find(x=>x.id===id));break;
   case 'delItem':if(b.dataset.armed){S.items=S.items.filter(x=>x.id!==id);commitExample();removeItemDoc(id);closeSheet();render();toast('Deleted')}else{b.dataset.armed=1;b.classList.add('danger');b.innerHTML=I('trash')+'Tap again'}break;
   case 'payItem':{const it=S.items.find(x=>x.id===id);payFlow(it,b.dataset.d);break}
   case 'unpayItem':{const it=S.items.find(x=>x.id===id);delete it.paid[b.dataset.d];touchItem(it);itemSheet(it);toast('Payment removed');break}
   case 'setPay':$('#pay_amt').value=b.dataset.amt;break;
   case 'savePay':savePay(id,b.dataset.d);break;
   case 'pay':{const src=b.dataset.src;
     if(src==='item'){const it=S.items.find(x=>x.id===id),d=b.dataset.d;if(it.paid&&it.paid[d]){delete it.paid[d];touchItem(it);toast('Marked unpaid')}else payFlow(it,d)}
     else if(src==='vloan'){const vv=S.vehicles.find(x=>x.id===b.dataset.vid),k=b.dataset.k;const L=vv.loan;L.paid=L.paid||[];if(L.paid.includes(k))L.paid=L.paid.filter(x=>x!==k);else L.paid.push(k);touch(vv);toast(L.paid.includes(k)?'Marked paid':'Marked unpaid')}
     break}
   case 'occ':{const src=b.dataset.src;if(src==='item'){const it=S.items.find(x=>x.id===id);if(it)itemSheet(it)}else{S.settings.currentId=b.dataset.vid;S.view='wallet';render();scrollTo(0,0)}break}
   case 'att':{const k=b.dataset.kind;if(k==='item'){const it=S.items.find(x=>x.id===id);if(it)itemSheet(it)}else if(k==='veh'){S.settings.currentId=b.dataset.vid;S.view='wallet';render();scrollTo(0,0)}else simpleSheet('lic');break}
   case 'vwallet':S.settings.currentId=b.dataset.vid;closeSheet();S.view='wallet';render();scrollTo(0,0);break;
   case 'vopen':S.settings.currentId=b.dataset.vid;S.view=b.dataset.to||'vhome';render();scrollTo(0,0);break;
   case 'close':closeSheet();break;
  }
});
boot();
</script>

<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</body>
